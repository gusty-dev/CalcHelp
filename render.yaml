services:
  - type: web
    name: calc-help
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: BOT_TOKEN
        sync: false
      - key: BOT_LINK
        sync: false
      - key: SITE_URL
        value: https://calchelp.onrender.com
